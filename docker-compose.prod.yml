# docker-compose.prod.yml — PRODUCTION
#
# Four containers: db, server (Express), client (Nginx), proxy (Caddy with automatic HTTPS)
# All env vars are injected via a .env file on the VPS (never committed to git).
#
# Usage on VPS:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Update after a new deploy:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d --no-build  # if using pre-built images
#   # OR rebuild locally and push, then:
#   docker compose -f docker-compose.prod.yml up -d --build

name: dnd-prod

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    # NOT exposed to host in production — only reachable within Docker network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Express API Server ──────────────────────────────────────────────────────
  server:
    image: ${DOCKER_IMAGE_SERVER:-ghcr.io/salihylmaz/dnd-server}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      NODE_ENV: production
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    # Not exposed to host — Nginx proxies to it

  # ── Nginx + React SPA ───────────────────────────────────────────────────────
  client:
    image: ${DOCKER_IMAGE_CLIENT:-ghcr.io/salihylmaz/dnd-client}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: always
    expose:
      - "80"
    depends_on:
      - server

  # ── HTTPS reverse proxy ─────────────────────────────────────────────────────
  # Caddy obtains and renews TLS certificates automatically for APP_DOMAIN.
  proxy:
    image: caddy:2-alpine
    restart: always
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - client

volumes:
  db_data:
  caddy_data:
  caddy_config:
