name: Deploy to Production

on:
  # Deploy manually after CI succeeds and production settings are ready.
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Configure this environment without required reviewers to deploy immediately.
    environment: production   # requires manual approval if configured in GitHub

    steps:
      - uses: actions/checkout@v4

      # ── SSH into Lightsail and build from the checked-out source ──────────
      # Required GitHub Secrets (set in repo Settings → Secrets):
      #   VPS_HOST      — IP or domain of your VPS
      #   VPS_USER      — SSH user (e.g. ubuntu, root)
      #   VPS_SSH_KEY   — private SSH key (the VPS has the matching public key)
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/DnDWebPage
            git pull --ff-only origin main
            sudo docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            # Remove old dangling images to save disk space
            sudo docker image prune -f

            echo "✅ Deploy complete."

      - name: Notify success
        if: success()
        run: echo "🚀 Production deploy succeeded."

      - name: Notify failure
        if: failure()
        run: echo "❌ Production deploy FAILED."
