name: Deploy to Production

on:
  # Automatically deploy when CI succeeds on main
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

  # Or trigger manually from GitHub UI
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy (default: latest)
        default: latest
        required: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    # Only run if CI passed (for workflow_run trigger)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: production   # requires manual approval if configured in GitHub

    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.image_tag || 'latest' }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # ── SSH into VPS and run docker compose pull + up ─────────────────────
      # Required GitHub Secrets (set in repo Settings → Secrets):
      #   VPS_HOST      — IP or domain of your VPS
      #   VPS_USER      — SSH user (e.g. ubuntu, root)
      #   VPS_SSH_KEY   — private SSH key (the VPS has the matching public key)
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /opt/dnd-session-manager

            # Pull latest images
            IMAGE_TAG=${{ steps.tag.outputs.tag }} \
            docker compose -f docker-compose.prod.yml pull

            # Restart services with zero-downtime recreation
            IMAGE_TAG=${{ steps.tag.outputs.tag }} \
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Remove old dangling images to save disk space
            docker image prune -f

            echo "✅ Deploy complete. Tag: ${{ steps.tag.outputs.tag }}"

      - name: Notify success
        if: success()
        run: echo "🚀 Production deploy succeeded for tag ${{ steps.tag.outputs.tag }}"

      - name: Notify failure
        if: failure()
        run: echo "❌ Production deploy FAILED for tag ${{ steps.tag.outputs.tag }}"
